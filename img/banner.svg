<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#202b39"/>
      <stop offset="55%" stop-color="#26364a"/>
      <stop offset="100%" stop-color="#1b2431"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.18" cy="0.15" r="0.55">
      <stop offset="0%" stop-color="#3d6aff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#3d6aff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.85" r="0.5">
      <stop offset="0%" stop-color="#2f8f8a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2f8f8a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glow1)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>

  <!-- 极简声波，呼应 SonicAudio -->
  <g transform="translate(800 450)" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-linecap="round">
    <path d="M-520 0h80" stroke-width="3"/>
    <path d="M-400 -60v120" stroke-width="3"/>
    <path d="M-330 -110v220" stroke-width="3"/>
    <path d="M-260 -40v80" stroke-width="3"/>
    <path d="M-190 -170v340" stroke-width="3"/>
    <path d="M-120 -90v180" stroke-width="3"/>
    <path d="M-50 -230v460" stroke-width="3"/>
    <path d="M20 -140v280" stroke-width="3"/>
    <path d="M90 -60v120" stroke-width="3"/>
    <path d="M160 -190v380" stroke-width="3"/>
    <path d="M230 -30v60" stroke-width="3"/>
    <path d="M300 -120v240" stroke-width="3"/>
    <path d="M370 -50v100" stroke-width="3"/>
    <path d="M440 0h80" stroke-width="3"/>
  </g>

  <rect y="898" width="1600" height="2" fill="#3d6aff" fill-opacity="0.25"/>
</svg>
